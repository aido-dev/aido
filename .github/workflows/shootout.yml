# TEMPORARY — multi-model review shootout for article material.
# Runs the Aido review script three times (Claude / ChatGPT / Gemini) against
# the same PR, same personas, different model via AIDO_PROVIDER/AIDO_MODEL.
# Lives only on the demo branch; delete after capturing the reviews.
name: Shootout

on:
  # Runs on push to this demo branch (workflow_dispatch only works from the
  # default branch, and this workflow lives only here). PR number hardcoded.
  push:
    branches: [demo/multimodel-shootout]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  review:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Claude + ChatGPT already posted successfully; re-run Gemini only
          # (2.5-pro hit a free-tier 429 → use flash).
          - provider: GEMINI
            model: gemini-2.5-flash
    name: review-${{ matrix.provider }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund openai@7.4.0 @octokit/rest@22.0.1 @google/generative-ai@0.24.1 @anthropic-ai/sdk@0.117.1
      - name: Run review (${{ matrix.provider }} / ${{ matrix.model }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHATGPT_API_KEY: ${{ secrets.CHATGPT_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Fixed path (runner.temp resolves at compile time) — write and read in
          # the same step so no cross-step $GITHUB_ENV dependency is involved.
          GITHUB_EVENT_PATH: ${{ runner.temp }}/aido_event.json
          AIDO_PROVIDER: ${{ matrix.provider }}
          AIDO_MODEL: ${{ matrix.model }}
        run: |
          echo '{"pull_request":{"number":105}}' > "$GITHUB_EVENT_PATH"
          node .github/scripts/review/aido-review.js
