# -----------------------------------------------------------------------------
# Aido Digest — the "what shipped" digest
#
# Summarizes the pull requests merged in a recent window (default: 7 days) into
# a skimmable digest and posts it as a new GitHub Issue ("📦 What shipped — …").
# Configure the window, model, and more in
# .github/scripts/digest/aido-digest-config.json.
#
# Runs on a weekly schedule and on manual dispatch. Two ways to use it:
#   • Copy-based install: this file lives in your repo and runs on schedule.
#   • Remote install: a thin caller in your repo runs on schedule and calls this
#     workflow with `aido_ref` (see examples/remote/aido-digest.yml).
#
# Scheduled workflows run from the default branch. To change the cadence, edit
# the cron below (and keep the config `lookbackDays` in sync).
# -----------------------------------------------------------------------------

name: Aido Digest (Reusable)

on:
  schedule:
    - cron: '0 9 * * 1' # Mondays at 09:00 UTC
  workflow_dispatch: {}
  workflow_call:
    inputs:
      aido_ref:
        description: "Git ref of aido-dev/aido to run Aido from (remote install). Leave empty to use the calling repository's own copy of the scripts."
        required: false
        type: string
        default: ''
    secrets:
      CHATGPT_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
      CLAUDE_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  aido-digest:
    name: Aido Digest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout Aido scripts (remote install)
        if: inputs.aido_ref != ''
        uses: actions/checkout@v7
        with:
          repository: aido-dev/aido
          ref: ${{ inputs.aido_ref }}
          path: .aido-remote

      - name: Resolve scripts directory
        id: aido
        env:
          AIDO_REF: ${{ inputs.aido_ref }}
        run: |
          if [ -n "$AIDO_REF" ]; then
            # Remote install: run scripts from the aido-dev/aido checkout, but let
            # this repository's config files (if any) override the shipped defaults.
            if [ -d .github/scripts ]; then
              find .github/scripts -maxdepth 2 -name 'aido-*-config.json' -exec cp --parents {} .aido-remote/ \;
            fi
            echo "scripts=.aido-remote/.github/scripts" >> "$GITHUB_OUTPUT"
          else
            echo "scripts=.github/scripts" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies for Aido digest
        run: |
          npm install openai@latest @octokit/rest @google/generative-ai @anthropic-ai/sdk

      - name: Run Aido Digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHATGPT_API_KEY: ${{ secrets.CHATGPT_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node ${{ steps.aido.outputs.scripts }}/digest/aido-digest.js
